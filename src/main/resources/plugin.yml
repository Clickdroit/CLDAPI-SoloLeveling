name: SoloLevelingUHC
main: fr.clickdroit.sololeveling.SoloLevelingPlugin
version: 1.0.0
author: Clickdroit
description: Solo Leveling UHC - Mode de jeu avec rôles basé sur l'univers Solo Leveling
depend: [UHCAPI]

commands:
  sololeveling:
    description: Commande principale Solo Leveling
    aliases: [sl, slu]
    usage: /sololeveling <subcommand>
  role:
    description: Affiche les informations sur votre rôle
    usage: /role
  powers:
    description: Ouvre le menu des pouvoirs
    aliases: [power, p]
    usage: /powers
  camp:
    description: Affiche les informations sur votre camp
    usage: /camp
  cc:
    description: Envoie un message privé aux membres de votre camp
    aliases: [campchat]
    usage: /cc <message>

permissions:
  sololeveling.admin:
    description: Accès aux commandes admin
    default: op
  sololeveling.host:
    description: Accès aux commandes host
    default: op
