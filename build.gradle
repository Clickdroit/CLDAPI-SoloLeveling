plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

group = 'fr.clickdroit'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
    maven {
        name = 'spigot-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    maven {
        name = 'bungeecord-repo'
        url = 'https://oss.sonatype.org/content/repositories/snapshots/'
    }
    maven {
        name = 'paper-repo'
        url = 'https://papermc.io/repo/repository/maven-public/'
    }
}

dependencies {
    // Spigot API
    compileOnly('org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT') {
        exclude group: 'net.md-5', module: 'bungeecord-chat'
    }
    
    // CLDAPI - API UHC de base
    compileOnly files('../CLDAPI/build/libs/UHC-1.0.jar')
    
    // Lombok (optionnel mais recommandé)
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// Configuration du Shadow JAR
shadowJar {
    archiveBaseName.set('SL-UHC')
    archiveVersion.set('')
    archiveClassifier.set('')
    // Le fichier généré sera: SL-UHC.jar
    
    destinationDirectory.set(file('C:/Users/Administrator/Desktop/Un huit/plugins'))
}

// Le build standard utilise shadowJar
build.dependsOn shadowJar
